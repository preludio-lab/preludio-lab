# OWASP ZAP Baseline Scan Rules Configuration
# このファイルは誤検知（False Positive）を除外し、実際のセキュリティリスクに集中するために使用されます。
#
# フォーマット: [Alert ID] [Action]
# Action:
#   IGNORE - レポートに含めない（完全に無視）
#   INFO   - 情報レベルとして記録（ビルドは失敗させない）
#   WARN   - 警告レベル（デフォルト）
#   FAIL   - 失敗扱い（ビルドを失敗させる）
#
# Alert ID リファレンス: https://www.zaproxy.org/docs/alerts/

# Cookie Without Secure Flag
# 理由: Preview環境ではHTTPSが保証されているが、Cookieに明示的なSecure属性がない場合がある
# Next.jsのセッションCookieは本番環境では自動的にSecure属性が付与される
10011 IGNORE

# X-Content-Type-Options Header Missing
# 理由: Next.jsがデフォルトで適切なContent-Typeヘッダーを設定
# Vercelのエッジネットワークでも追加のセキュリティヘッダーが付与される
10021 INFO

# Content Security Policy (CSP) Header Not Set
# 理由: 段階的にCSPを厳格化する予定。現時点では情報レベルで記録
# Phase 2でnonce-based CSPを実装予定
10038 INFO

# Absence of Anti-CSRF Tokens
# 理由: Next.jsのServer Actionsは独自のCSRF対策（Origin検証）を実装
# フォームベースの攻撃に対しては十分な保護が提供されている
10202 INFO

# X-Frame-Options Header Not Set
# 理由: Next.jsのデフォルト設定で`X-Frame-Options: DENY`が設定される
# Vercelでも追加のクリックジャッキング対策が有効
10020 INFO

# Strict-Transport-Security Header Not Set
# 理由: Vercelが自動的にHSTSヘッダーを付与（max-age=31536000; includeSubDomains）
# Preview環境でも同様の設定が適用される
10035 INFO
