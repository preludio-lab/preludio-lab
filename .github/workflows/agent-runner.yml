name: AI Agent Runner

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: 'Script to run (pnpm run <script>)'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          # Add other agents here as they are implemented
          # - agent:writer
          # - agent:composer
          # - agent:translator

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Safety limit for Free Tier

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Agent Script
        working-directory: ./agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm run ${{ inputs.script_name }}
