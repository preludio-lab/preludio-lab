    name: 'mozart-piano-sonatas'
    description: 'Mozart Piano Sonatas (Kern format). Contains all 18 sonatas.'
    license: 'CC0 1.0'
  - id: 'openscore/beethoven-piano-sonatas'
    provider: 'github'
    owner: 'openscore'
    name: 'beethoven-piano-sonatas'
    description: 'Beethoven Piano Sonatas (MusicXML/Kern format). High quality digital scores.'
    license: 'CC0 1.0'
  - id: 'humdrum-tools/humdrum-data'
    provider: 'github'
    owner: 'humdrum-tools'
    name: 'humdrum-data'
