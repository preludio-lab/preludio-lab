# 6. Impression Scales (印象評価軸)
# ===============================
# 楽曲の印象を定量的に評価するための軸定義。
# src/domain/work/work.shared.ts の ImpressionDimensionsSchema に準拠。

impression_scales:
  - id: innovation
    label:
      ja: 革新性
      en: Innovation
      de: Innovation
      fr: Innovation
      it: Innovazione
      es: Innovación
      zh: 革新性
    description:
      ja: 伝統的な形式や語法を重んじるか、あるいは革新的・前衛的な試みを行うか。
      en: Whether it respects traditional forms and idioms or engages in innovative/avant-garde experiments.
    min_label:
      ja: 伝統的
      en: Traditional
      de: Traditionell
      fr: Traditionnel
      it: Tradizionale
      es: Tradicional
      zh: 传统
    max_label:
      ja: 前衛的
      en: Avant-garde
      de: Avantgardistisch
      fr: Avant-gardiste
      it: d'avanguardia
      es: de vanguardia
      zh: 前卫
    criteria:
      - score_range: [-10, -7]
        label:
          ja: 古典的・保守的
          en: Classical / Conservative
          de: Klassisch / Konservativ
          fr: Classique / Conservateur
          it: Classico / Conservatore
          es: Clásico / Conservador
          zh: 古典 / 保守
      - score_range: [-6, -3]
        label:
          ja: 伝統の継承
          en: Continuation of Tradition
          de: Traditionell
          fr: Traditionnel
          it: Tradizionale
          es: Tradicional
          zh: 传统继承
      - score_range: [-2, 2]
        label:
          ja: 標準
          en: Neutral
          de: Neutral
          fr: Neutre
          it: Neutrale
          es: Neutral
          zh: 标准
      - score_range: [3, 6]
        label:
          ja: 斬新・独立的
          en: Novel / Independent
          de: Neuartig / Unabhängig
          fr: Novateur / Indépendant
          it: Novativo / Indipendente
          es: Novedoso / Independiente
          zh: 斩新 / 独立
      - score_range: [7, 10]
        label:
          ja: 過激・前衛的
          en: Radical / Avant-garde
          de: Radikal / Avantgardistisch
          fr: Radical / Avant-gardiste
          it: Radicale / d'avanguardia
          es: Radical / de vanguardia
          zh: 激进 / 前卫

  - id: emotionality
    label:
      ja: 情動性
      en: Emotionality
      de: Emotionalität
      fr: Émotivité
      it: Emotività
      es: Emotividad
      zh: 情动性
    description:
      ja: 客観的・論理的な構築を重視するか、あるいは主観的・情熱的な感情露呈を重視するか。
      en: Whether it emphasizes objective/logical construction or subjective/passionate emotional expression.
    min_label:
      ja: 客観的・理性的
      en: Objective / Rational
      de: Objektiv / Rational
      fr: Objectif / Rationnel
      it: Oggettivo / Razionale
      es: Objetivo / Racional
      zh: 客观 / 理性
    max_label:
      ja: 情熱的・主観的
      en: Passionate / Subjective
      de: Leidenschaftlich / Subjektiv
      fr: Passionné / Subjectif
      it: Appassionato / Soggettivo
      es: Apasionado / Subjetivo
      zh: 激情 / 主观
    criteria:
      - score_range: [-10, -7]
        label:
          ja: 冷徹・厳格
          en: Rigorous / Austere
          de: Streng / Kalt
          fr: Rigoureux / Austère
          it: Rigoroso / Austero
          es: Rigoroso / Austero
          zh: 冷峻 / 严格
      - score_range: [-6, -3]
        label:
          ja: 中立・客観
          en: Neutral / Objective
          de: Neutral / Objektiv
          fr: Neutre / Objectif
          it: Neutrale / Oggettivo
          es: Neutral / Objetivo
          zh: 中立 / 客观
      - score_range: [-2, 2]
        label:
          ja: 標準
          en: Neutral
          de: Neutral
          fr: Neutre
          it: Neutrale
          es: Neutral
          zh: 标准
      - score_range: [3, 6]
        label:
          ja: 情緒的・表情豊か
          en: Emotional / Expressive
          de: Emotional / Ausdrucksvoll
          fr: Émotionnel / Expressif
          it: Emozionale / Espressivo
          es: Emocional / Expresivo
          zh: 情绪化 / 表情丰富
      - score_range: [7, 10]
        label:
          ja: 激情・忘我
          en: Passionate / Ecstatic
          de: Leidenschaftlich / Ekstatisch
          fr: Passionné / Extatique
          it: Appassionato / Estatico
          es: Apasionado / Extático
          zh: 激情 / 忘我

  - id: nationalism
    label:
      ja: 民族性
      en: Nationalism
      de: Nationalismus
      fr: Nationalisme
      it: Nazionalismo
      es: Nacionalismo
      zh: 民族性
    description:
      ja: 普遍的な音楽言語（国際様式）を志向するか、あるいは特定の民族・土着的な情緒を志向するか。
      en: Whether it aims for a universal musical language (international style) or specific ethnic/indigenous sentiments.
    min_label:
      ja: 普遍的・国際的
      en: Universal / International
      de: Universell / International
      fr: Universel / International
      it: Universale / Internazionale
      es: Universal / Internacional
      zh: 普遍 / 国际
    max_label:
      ja: 民族的・土着的
      en: National / Indigenous
      de: National / Folkloristisch
      fr: National / Folklorique
      it: Nazionale / Folklorico
      es: Nacional / Folclórico
      zh: 民族 / 土著
    criteria:
      - score_range: [-10, -7]
        label:
          ja: 普遍・絶対的
          en: Universal / Absolute
          de: Universell / Absolut
          fr: Universel / Absolu
          it: Universale / Assoluto
          es: Universal / Absoluto
          zh: 普遍 / 绝对
      - score_range: [-6, -3]
        label:
          ja: 国際様式
          en: International Style
          de: Internationaler Stil
          fr: Style international
          it: Stile internazionale
          es: Estilo internacional
          zh: 国际样式
      - score_range: [-2, 2]
        label:
          ja: 標準
          en: Neutral
          de: Neutral
          fr: Neutre
          it: Neutrale
          es: Neutral
          zh: 标准
      - score_range: [3, 6]
        label:
          ja: 郷土色の反映
          en: Regional Color
          de: Lokalkolorit
          fr: Couleur locale
          it: Colore locale
          es: Color local
          zh: 乡土色彩
      - score_range: [7, 10]
        label:
          ja: 強い民族主義
          en: Strong Nationalism
          de: Nationalistisch
          fr: Nationaliste
          it: Nazionalista
          es: Nacionalista
          zh: 强烈民族主义

  - id: scale
    label:
      ja: 規模感
      en: Scale
      de: Umfang / Skala
      fr: Échelle / Envergure
      it: Scala / Grandezza
      es: Escala / Magnitud
      zh: 规模感
    description:
      ja: 空間的な広がりと編成の規模感。室内楽的な親密さから、宇宙的な壮大さまで。
      en: Spatial breadth and size of the ensemble, from chamber intimacy to cosmic grandeur.
    min_label:
      ja: 親密・個人的
      en: Intimate / Personal
      de: Intim / Persönlich
      fr: Intime / Personnel
      it: Intimo / Personale
      es: Íntimo / Personal
      zh: 亲密 / 个人
    max_label:
      ja: 壮大・宇宙的
      en: Grand / Universal
      de: Grandios / Universell
      fr: Grandiose / Universel
      it: Grandioso / Universale
      es: Grandioso / Universal
      zh: 壮大 / 宏伟
    criteria:
      - score_range: [-10, -7]
        label:
          ja: 孤独・極少編成
          en: Solitary / Minimalist
          de: Einsam / Minimalistisch
          fr: Solitaire / Minimaliste
          it: Solitario / Minimalista
          es: Solitario / Minimalista
          zh: 孤独 / 极小编制
      - score_range: [-6, -3]
        label:
          ja: 室内楽的・親密
          en: Chamber-like / Intimate
          de: Kammermusikalisch / Intim
          fr: De chambre / Intime
          it: Da camera / Intimo
          es: De cámara / Íntimo
          zh: 室内乐 / 亲密
      - score_range: [-2, 2]
        label:
          ja: 標準
          en: Neutral
          de: Neutral
          fr: Neutre
          it: Neutrale
          es: Neutral
          zh: 标准
      - score_range: [3, 6]
        label:
          ja: 堂々とした規模
          en: Grand Scale
          de: Großer Umfang
          fr: Grande échelle
          it: Grande scala
          es: Gran escala
          zh: 堂堂规模
      - score_range: [7, 10]
        label:
          ja: 宇宙的・極大
          en: Cosmic / Immense
          de: Universell / Immens
          fr: Universel / Immense
          it: Universale / Immenso
          es: Universal / Inmenso
          zh: 宇宙的 / 极大

  - id: complexity
    label:
      ja: 複雑性
      en: Complexity
      de: Komplexität
      fr: Complexité
      it: Complessità
      es: Complejidad
      zh: 复杂性
    description:
      ja: 旋律の明快さ・単純さか、あるいは対位法的・多声的な緻密さと難解さか。
      en: Clarity/simplicity of melody vs. contrapuntal/polyphonic intricacy and complexity.
    min_label:
      ja: 明快・単純
      en: Clear / Simple
      de: Klar / Einfach
      fr: Clair / Simple
      it: Chiaro / Semplice
      es: Claro / Simple
      zh: 明快 / 简单
    max_label:
      ja: 緻密・難解
      en: Intricate / Abstruse
      de: Komplex / Schwierig
      fr: Complexe / Difficile
      it: Complesso / Difficile
      es: Complejo / Difícil
      zh: 缜密 / 难解
    criteria:
      - score_range: [-10, -7]
        label:
          ja: 素朴・純真
          en: Simple / Innocent
          de: Schlicht / Naiv
          fr: Simple / Naïf
          it: Semplice / Ingenuo
          es: Simple / Inocente
          zh: 素朴 / 纯真
      - score_range: [-6, -3]
        label:
          ja: 簡潔・明瞭
          en: Concise / Clear
          de: Knapp / Klar
          fr: Concis / Clair
          it: Concise / Chiaro
          es: Conciso / Claro
          zh: 简洁 / 明了
      - score_range: [-2, 2]
        label:
          ja: 標準
          en: Neutral
          de: Neutral
          fr: Neutre
          it: Neutrale
          es: Neutral
          zh: 标准
      - score_range: [3, 6]
        label:
          ja: 対位法的・知的
          en: Contrapuntal / Intellectual
          de: Kontrapunktisch / Intellektuell
          fr: Contrapuntique / Intellectuel
          it: Contrappuntistico / Intellettuale
          es: Contrapuntístico / Intelectual
          zh: 对位法 / 知性
      - score_range: [7, 10]
        label:
          ja: 極めて緻密・難解
          en: Highly Intricate / Abstruse
          de: Hochkomplex / Tiefgründig
          fr: Très complexe / Profond
          it: Molto complesso / Profondo
          es: Muy complejo / Profundo
          zh: 极精密 / 难解

  - id: theatricality
    label:
      ja: 演劇性
      en: Theatricality (Drama)
      de: Theatralik (Dramatik)
      fr: Théâtralité (Dramatique)
      it: Teatralità (Dramma)
      es: Teatralidad (Drama)
      zh: 演剧性 (戏剧性)
    description:
      ja: 抽象的な音の構成（純音楽）を志向するか、あるいは物語的・舞台的なドラマを志向するか。
      en: Whether it aims for abstract sound structure (absolute music) or narrative/theatrical drama.
    min_label:
      ja: 抽象的・純音楽
      en: Abstract / Absolute Music
      de: Abstrakt / Absolute Musik
      fr: Abstrait / Musique absolue
      it: Astratto / Musica assoluta
      es: Abstracto / Música absoluta
      zh: 抽象 / 绝对音楽
    max_label:
      ja: 物語的・劇的
      en: Narrative / Dramatic
      de: Erzählend / Dramatisch
      fr: Narratif / Dramatique
      it: Narrativo / Drammatico
      es: Narrativo / Dramático
      zh: 叙事 / 剧烈
    criteria:
      - score_range: [-10, -7]
        label:
          ja: 非劇的・静止
          en: Undramatic / Static
          de: Undramatisch / Statisch
          fr: Non dramatique / Statique
          it: Non drammatico / Statico
          es: No dramático / Estático
          zh: 非戏剧 / 静止
      - score_range: [-6, -3]
        label:
          ja: 抽象・対自的
          en: Abstract / Introspective
          de: Abstrakt / Introspektiv
          fr: Abstrait / Introspectif
          it: Astratto / Introspettivo
          es: Abstracto / Introspectivo
          zh: 抽象 / 内省
      - score_range: [-2, 2]
        label:
          ja: 標準
          en: Neutral
          de: Neutral
          fr: Neutre
          it: Neutrale
          es: Neutral
          zh: 标准
      - score_range: [3, 6]
        label:
          ja: 情景的・演劇的
          en: Scenic / Theatrical
          de: Szenisch / Theatralisch
          fr: Scénique / Théâtral
          it: Scenico / Teatrale
          es: Escénico / Teatral
          zh: 情景 / 演剧
      - score_range: [7, 10]
        label:
          ja: 映画的・総合芸術
          en: Cinematic / Total Art
          de: Filmisch / Gesamtkunstwerk
          fr: Cinématique / Art total
          it: Cinematografico / Opera d'arte totale
          es: Cinematográfico / Obra de arte total
          zh: 影视化 / 综合艺术
