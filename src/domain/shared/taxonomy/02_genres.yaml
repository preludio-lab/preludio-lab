# 2. Genres & Musical Forms (ジャンル・楽曲形式)
# ============================================
# 楽曲の分類（媒体・編成）および構造的・歴史的な形式。

genres:
  - category: orchestral
    label:
      ja: 管弦楽曲
      en: Orchestral
      de: Sinfonik / Orchestermusik
      fr: Musique symphonique
      it: Musica orchestrale
      es: Música para orquesta
      zh: 管弦乐
    items:
      - id: symphony
        label:
          ja: 交響曲
          en: Symphony
          de: Sinfonie
          fr: Symphonie
          it: Sinfonia
          es: Sinfonía
          zh: 交响曲
        description:
          ja: 管弦楽のための多楽章形式の主要作品。
          en: A major work for orchestra, usually in several movements.
      - id: overture
        label:
          ja: 序曲・前奏曲
          en: Overture / Prelude
          de: Ouvertüre / Präludium
          fr: Ouverture / Prélude
          it: Ouverture / Preludio
          es: Obertura / Preludio
          zh: 序曲 / 前奏曲
        description:
          ja: 劇作品の導入部、あるいは自立した管弦楽曲。
          en: An introductory piece for a dramatic work or an independent orchestral work.
      - id: tone-poem
        label:
          ja: 交響詩
          en: Tone Poem
          de: Sinfonische Dichtung
          fr: Poème symphonique
          it: Poema sinfonico
          es: Poema sinfónico
          zh: 交响诗
        description:
          ja: 文学的、絵画的な内容を音楽で描写した作品。
          en: An orchestral work that illustrates a literary or pictorial idea.
      - id: suite-orch
        label:
          ja: 管弦楽組曲
          en: Orchestral Suite
          de: Orchestersuite
          fr: Suite pour orchestre
          it: Suite orchestrale
          es: Suite para orquesta
          zh: 管弦乐组曲
        description:
          ja: 舞曲や性格的小品を並べた多楽章形式。
          en: A multi-movement orchestral work consisting of dances or characteristic pieces.
      - id: serenade-divertimento
        label:
          ja: セレナード・ディヴェルティメント
          en: Serenade / Divertimento
          de: Serenade / Divertimento
          fr: Sérénade / Divertimento
          it: Serenata / Divertimento
          es: Serenata / Divertimento
          zh: 小夜曲 / 嬉游曲
        description:
          ja: 娯楽的、社交的な性格を持つ多楽章の器楽曲。
          en: Multi-movement instrumental works with an entertaining or social character.
      - id: incidental-music
        label:
          ja: 劇付随音楽
          en: Incidental Music
          de: Schauspielmusik
          fr: Musique de scène
          it: Musica di scena
          es: Música de escena
          zh: 剧付随音楽
        description:
          ja: 演劇、劇作品の伴奏・挿入曲。
          en: Music for a play, including overtures, interludes, and background music.

  - category: stage
    label:
      ja: 舞台音楽
      en: Stage Music
      de: Bühnenmusik
      fr: Musique de scène
      it: Musica per il teatro
      es: Música escénica
      zh: 舞台音乐
    items:
      - id: opera
        label:
          ja: オペラ
          en: Opera
          de: Oper
          fr: Opéra
          it: Opera
          es: Ópera
          zh: 歌剧
        description:
          ja: 歌唱、演技、管弦楽を伴う総合芸術。
          en: A dramatic work combining singing, acting, and orchestral music.
      - id: operetta
        label:
          ja: オペレッタ
          en: Operetta
          de: Operette
          fr: Opérette
          it: Operetta
          es: Opereta
          zh: 轻歌剧
        description:
          ja: 喜劇的、世俗的な性格を持つ軽い歌劇。
          en: A light opera, usually with spoken dialogue and comic plots.
      - id: ballet
        label:
          ja: バレエ音楽
          en: Ballet Music
          de: Ballettmusik
          fr: Musique de ballet
          it: Musica per balletto
          es: Música para ballet
          zh: 芭蕾舞音乐
        description:
          ja: 舞踏のための音楽作品。
          en: Music composed specifically for a ballet performance.

  - category: concerto
    label:
      ja: 協奏曲
      en: Concerto
      de: Konzert
      fr: Concerto
      it: Concerto
      es: Concierto
      zh: 协奏曲
    items:
      - id: piano-concerto
        label:
          ja: ピアノ協奏曲
          en: Piano Concerto
          de: Klavierkonzert
          fr: Concerto pour piano
          it: Concerto per pianoforte
          es: Concierto para piano
          zh: 钢琴协奏曲
        description:
          ja: 独奏ピアノと管弦楽のための協奏曲。
          en: A concerto for solo piano and orchestra.
      - id: violin-concerto
        label:
          ja: ヴァイオリン協奏曲
          en: Violin Concerto
          de: Violinkonzert
          fr: Concerto pour violon
          it: Concerto per violino
          es: Concierto para violín
          zh: 小提琴协奏曲
        description:
          ja: 独奏ヴァイオリンと管弦楽のための協奏曲。
          en: A concerto for solo violin and orchestra.
      - id: cello-concerto
        label:
          ja: チェロ協奏曲
          en: Cello Concerto
          de: Cellokonzert
          fr: Concerto pour violoncelle
          it: Concerto per violoncello
          es: Concierto para violonchelo
          zh: 大提琴协奏曲
        description:
          ja: 独奏チェロと管弦楽のための協奏曲。
          en: A concerto for solo cello and orchestra.
      - id: wind-concerto
        label:
          ja: 管楽器のための協奏曲
          en: Wind Concerto
          de: Bläserkonzert
          fr: Concerto pour instruments à vent
          it: Concerto per strumenti a fiato
          es: Concierto para instrumentos de viento
          zh: 管乐协奏曲
        description:
          ja: 木管、金管楽器を独奏とする協奏曲。
          en: A concerto featuring a solo woodwind or brass instrument.
      - id: concerto-grosso
        label:
          ja: 合奏協奏曲
          en: Concerto Grosso
          de: Concerto Grosso
          fr: Concerto grosso
          it: Concerto grosso
          es: Concerto grosso
          zh: 大协奏曲
        description:
          ja: 独奏楽器群（コンチェルティーノ）と合奏（リピエーノ）の対比を特徴とするバロック形式。
          en: A Baroque form featuring contrast between a small group of soloists (concertino) and the full orchestra (ripieno).
      - id: concerted-work
        label:
          ja: 協奏的楽曲
          en: Concerted Work
          de: Konzertantes Werk
          fr: Œuvre concertante
          it: Opera concertante
          es: Obra concertante
          zh: 协奏性作品
        description:
          ja: 「協奏曲」の名称を持たない、独奏楽器と管弦楽のための作品。
          en: A work for solo instrument(s) and orchestra that is not formally titled "concerto".

  - category: chamber
    label:
      ja: 室内楽曲
      en: Chamber Music
      de: Kammermusik
      fr: Musique de chambre
      it: Musica da camera
      es: Música de cámara
      zh: 室内乐
    items:
      - id: chamber-strings
        label:
          ja: 弦楽重奏
          en: String Ensemble
          de: Streicherensemble
          fr: Ensemble à cordes
          it: Ensemble d'archi
          es: Conjunto de cuerdas
          zh: 弦乐合奏
        description:
          ja: 弦楽器のみによるアンサンブル。
          en: Ensemble music performed by string instruments only.
      - id: string-quartet
        label:
          ja: 弦楽四重奏曲
          en: String Quartet
          de: Streichquartett
          fr: Quatuor à cordes
          it: Quartetto d'archi
          es: Cuarteto de cuerdas
          zh: 弦乐四重奏
      - id: string-trio
        label:
          ja: 弦楽三重奏曲
          en: String Trio
          de: Streichtrio
          fr: Trio à cordes
          it: Trio d'archi
          es: Trío de cuerdas
          zh: 弦乐三重奏
      - id: string-quintet
        label:
          ja: 弦楽五重奏曲
          en: String Quintet
          de: Streichquintett
          fr: Quintette à cordes
          it: Quintetto d'archi
          es: Quinteto de cuerdas
          zh: 弦乐五重奏
      - id: chamber-piano
        label:
          ja: ピアノ重奏
          en: Piano Ensemble
          de: Klavierensemble
          fr: Ensemble avec piano
          it: Ensemble con pianoforte
          es: Conjunto con piano
          zh: 钢琴合奏
        description:
          ja: 独奏楽器とピアノによるアンサンブル。
          en: Ensemble for solo instrument(s) and piano.
      - id: piano-trio
        label:
          ja: ピアノ三重奏曲
          en: Piano Trio
          de: Klaviertrio
          fr: Trio avec piano
          it: Trio con pianoforte
          es: Trío con piano
          zh: 钢琴三重奏
      - id: piano-quartet
        label:
          ja: ピアノ四重奏曲
          en: Piano Quartet
          de: Klavierquartett
          fr: Quatuor avec piano
          it: Quartetto con pianoforte
          es: Cuarteto con piano
          zh: 钢琴四重奏
      - id: piano-quintet
        label:
          ja: ピアノ五重奏曲
          en: Piano Quintet
          de: Klavierquintett
          fr: Quintette avec piano
          it: Quintetto con pianoforte
          es: Quinteto con piano
          zh: 钢琴五重奏
      - id: sonata-duo
        label:
          ja: 独奏ソナタ（伴奏付）
          en: Instrumental Sonata (with Piano)
          de: Instrumentalsonate (mit Klavier)
          fr: Sonate instrumentale (avec piano)
          it: Sonata strumentale (con pianoforte)
          es: Sonata instrumental (con piano)
          zh: 独奏奏鸣曲（有伴奏）
        description:
          ja: 独奏楽器とピアノのためのソナタ。
          en: A sonata for a solo instrument and piano accompaniment.
      - id: violin-sonata
        label:
          ja: ヴァイオリンソナタ
          en: Violin Sonata
          de: Violinsonate
          fr: Sonate pour violon
          it: Sonata per violino
          es: Sonata para violín
          zh: 小提琴奏鸣曲
      - id: cello-sonata
        label:
          ja: チェロソナタ
          en: Cello Sonata
          de: Cellosonate
          fr: Sonate pour violoncelle
          it: Sonata per violoncello
          es: Sonata para violonchelo
          zh: 大提琴奏鸣曲
      - id: viola-sonata
        label:
          ja: ヴィオラソナタ
          en: Viola Sonata
          de: Violasonate
          fr: Sonate pour alto
          it: Sonata per viola
          es: Sonata para viola
          zh: 中提琴奏鸣曲
      - id: flute-sonata
        label:
          ja: フルートソナタ
          en: Flute Sonata
          de: Flötensonate
          fr: Sonate pour flûte
          it: Sonata per flauto
          es: Sonata para flauta
          zh: 长笛奏鸣曲
      - id: clarinet-sonata
        label:
          ja: クラリネットソナタ
          en: Clarinet Sonata
          de: Klarinettensonate
          fr: Sonate pour clarinette
          it: Sonata per clarinetto
          es: Sonata para clarinete
          zh: 单簧管奏鸣曲
      - id: keyboard-ensemble
        label:
          ja: 鍵盤アンサンブル
          en: Keyboard Ensemble
          de: Klavierensemble (vierhändig / 2 Klaviere)
          fr: Ensemble de claviers
          it: Ensemble di tastiere
          es: Conjunto de teclados
          zh: 键盘合奏
        description:
          ja: 複数人によるピアノ演奏などの鍵盤アンサンブル曲。
          en: Works for keyboard ensemble, e.g., piano four-hands or two pianos.
      - id: chamber-wind
        label:
          ja: 管楽アンサンブル
          en: Wind Ensemble
          de: Bläserensemble
          fr: Ensemble à vent
          it: Ensemble di fiati
          es: Conjunto de vientos
          zh: 管乐合奏
        description:
          ja: 管楽器のみ、あるいは管楽器主体の室内楽編成。
          en: Chamber music for wind instruments, such as a wind quintet.
      - id: chamber-mixed
        label:
          ja: 混合・その他アンサンブル
          en: Mixed / Other Ensemble
          de: Gemischtes Ensemble
          fr: Ensemble mixte
          it: Ensemble misto
          es: Conjunto mixto
          zh: 混合/其他合奏
        description:
          ja: 上記に当てはまらない楽器構成、あるいは特殊な大規模室内楽。
          en: Ensembles with a mix of different instrument families or unusual instrumentation.

  - category: solo
    label:
      ja: 独奏曲
      en: Solo Music
      de: Solomusik
      fr: Musique pour instrument seul
      it: Musica solista
      es: Música para solista
      zh: 独奏
    items:
      - id: keyboard-solo
        label:
          ja: 鍵盤独奏
          en: Keyboard Solo
          de: Klaviermusik / Tasteninstrument solo
          fr: Clavier seul
          it: Tastiera sola
          es: Teclado solo
          zh: 键盘独奏
        description:
          ja: ピアノ、オルガン、チェンバロ等の鍵盤楽器一台のための作品。
          en: Works for a single keyboard instrument like piano, organ, or harpsichord.
      - id: piano-sonata
        label:
          ja: ピアノソナタ
          en: Piano Sonata
          de: Klaviersonate
          fr: Sonate pour piano
          it: Sonata per pianoforte
          es: Sonata para piano
          zh: 钢琴奏鸣曲
      - id: organ-sonata
        label:
          ja: オルガンソナタ
          en: Organ Sonata
          de: Orgelsonate
          fr: Sonate pour orgue
          it: Sonata per organo
          es: Sonata para órgano
          zh: 管风琴奏鸣曲
      - id: string-solo
        label:
          ja: 弦楽器独奏
          en: String Solo
          de: Streichinstrument solo
          fr: Cordes seules
          it: Archi soli
          es: Cuerdas solas
          zh: 弦乐独奏
        description:
          ja: ヴァイオリン、チェロ等の弦楽器一台のみによる作品（無伴奏）。
          en: Works for a single string instrument without accompaniment.
      - id: wind-solo
        label:
          ja: 管楽器独奏
          en: Wind Solo
          de: Blasinstrument solo
          fr: Vent seul
          it: Fiati soli
          es: Viento solo
          zh: 管乐独奏
        description:
          ja: フルート、クラリネット等の管楽器一台のみによる作品（無伴奏）。
          en: Works for a single wind instrument without accompaniment.
      - id: solo-other-inst
        label:
          ja: その他独奏
          en: Other Instrumental Solo
          de: Sonstiges Instrumentalsolo
          fr: Autre instrument seul
          it: Altri strumenti soli
          es: Otros instrumentos solos
          zh: 其他独奏
        description:
          ja: ギター、打楽器など、上記以外の一台の楽器による作品。
          en: Works for other single instruments such as guitar, harp, or percussion.

  - category: vocal-choral
    label:
      ja: 声楽・合唱曲
      en: Vocal / Choral
      de: Vokalmusik / Chormusik
      fr: Musique vocale et chorale
      it: Musica vocale e corale
      es: Música vocal y coral
      zh: 声乐与合唱
    items:
      - id: lied
        label:
          ja: 歌曲
          en: Art Song / Lied
          de: Lied
          fr: Mélodie / Lied
          it: Lirica da camera / Lied
          es: Canción artística / Lied
          zh: 艺术歌曲 / 德奥艺术歌曲
        description:
          ja: 独唱とピアノのための叙情的作品。
          en: A lyric work for solo voice and piano.
      - id: song-cycle
        label:
          ja: 連作歌曲
          en: Song Cycle
          de: Liederkreis / Liederzyklus
          fr: Cycle de mélodies
          it: Ciclo di liriche
          es: Ciclo de canciones
          zh: 连作歌曲
        description:
          ja: 共通のテーマや詩による歌曲の連なり。
          en: A sequence of songs connected by a common theme or story.
      - id: mass-requiem
        label:
          ja: ミサ曲・レクイエム
          en: Mass / Requiem
          de: Messe / Requiem
          fr: Messe / Requiem
          it: Messa / Requiem
          es: Misa / Réquiem
          zh: 弥撒 / 安魂曲
        description:
          ja: キリスト教の典礼、あるいは死者のための大規模作品。
          en: Large-scale religious works for Christian liturgy or remembrance of the dead.
      - id: oratorio-passion
        label:
          ja: オラトリオ・受難曲
          en: Oratorio / Passion
          de: Oratorium / Passion
          fr: Oratorio / Passion
          it: Oratorio / Passione
          es: Oratorio / Pasión
          zh: 清唱剧 / 受难曲
        description:
          ja: 聖書や物語に基づく、演技を伴わない大規模な舞台風作品。
          en: Large-scale dramatic works for voices and orchestra, usually on a religious theme, without stage action.
      - id: cantata
        label:
          ja: カンタータ
          en: Cantata
          de: Kantate
          fr: Cantate
          it: Cantata
          es: Cantata
          zh: 康塔塔
        description:
          ja: 声楽、合唱、器楽伴奏による多楽章作品。
          en: A vocal work in several movements for soloists, chorus, and instrumental accompaniment.
      - id: early-vocal
        label:
          ja: 古楽声楽曲
          en: Early Vocal Music
          de: Alte Musik (Vokal)
          fr: Musique vocale ancienne
          it: Musica vocale antica
          es: Musica vocal antigua
          zh: 早期声乐
        description:
          ja: ルネサンス以前の形式を持つ声楽曲。
          en: Vocal works in forms common before the Baroque era, such as madrigals and motets.
      - id: choral-others
        label:
          ja: その他合唱曲
          en: Other Choral Works
          de: Sonstige Chormusik
          fr: Autres œuvres chorales
          it: Altre opere corali
          es: Otras obras corales
          zh: 其他合唱作品
        description:
          ja: 世俗合唱曲、アカペラなど。
          en: Secular choral pieces, a cappella works, and other vocal ensemble music.

  - category: form-led-genres
    label:
      ja: 形式主導のジャンル
      en: Form-led Genres
      de: Formbasierte Gattungen
      fr: Genres basés sur la forme
      it: Generi basati sulla forma
      es: Géneros basados en la forma
      zh: 形式主导的体裁
    description:
      ja: 特定の楽曲形式をタイトルや作品の根幹とするジャンル。
      en: Genres where a specific musical form serves as the title or the core of the work.
    items:
      - id: sonata
        label:
          ja: ソナタ
          en: Sonata
          de: Sonate
          fr: Sonate
          it: Sonata
          es: Sonata
          zh: 奏鸣曲
        description:
          ja: 古典派以前から続く多楽章の器楽曲。独奏や伴奏付き。モーツァルトやベートーヴェンの傑作群。
          en: A multi-movement instrumental work from the Classical era and beyond. Masterworks by Mozart, Beethoven, and others.
      - id: variations
        label:
          ja: 変奏曲
          en: Variations
          de: Variationen
          fr: Variations
          it: Variazioni
          es: Variaciones
          zh: 变奏曲
        description:
          ja: 主題を様々に変奏していく作品。バッハの『ゴールドベルク変奏曲』などの不朽の名作。
          en: A set of variations on a theme. Immortal works like Bach's "Goldberg Variations".
      - id: fugue-counterpoint
        label:
          ja: フーガ・対位法的作品
          en: Fugue / Contrapuntal Works
          de: Fuge / Kontrapunktische Werke
          fr: Fugue / Œuvres contrapuntiques
          it: Fuga / Opere contrappuntistiche
          es: Fuga / Obras contrapuntísticas
          zh: 赋格 / 对位作品
        description:
          ja: 高度な対位法に基づくジャンル。バッハの『フーガの技法』が頂点。
          en: Genres based on advanced counterpoint. Bach's "The Art of Fugue" represents its pinnacle.
      - id: suite-partita
        label:
          ja: 組曲・パルティータ
          en: Suite / Partita
          de: Suite / Partita
          fr: Suite / Partita
          it: Suite / Partita
          es: Suite / Partita
          zh: 组曲 / 帕蒂塔
        description:
          ja: バロック期の『イギリス組曲』や『パルティータ』など、複数の楽曲を連ねたジャンル。
          en: A collection of musical items, such as the Baroque "English Suites" or "Partitas".
      - id: rondo
        label:
          ja: ロンド
          en: Rondo
          de: Rondo
          fr: Rondeau / Rondo
          it: Rondò
          es: Rondó
          zh: 回旋曲
        description:
          ja: 主題が回帰する形式をタイトルとする独立曲。モーツァルトの『ロンド ニ長調』など。
          en: An independent work titled after its rondo structure, such as Mozart's "Rondo in D major".
      - id: aria
        label:
          ja: アリア（詠唱）
          en: Aria / Air
          de: Arie
          fr: Air / Aria
          it: Aria
          es: Aria
          zh: 咏叹调
        description:
          ja: オペラやオラトリオの看板となる歌。ヘンデルの『私を泣かせてください』など。
          en: The centerpiece of operas or oratorios, such as Handel's "Lascia ch'io pianga".
      - id: recitative
        label:
          ja: レチタティーヴォ（叙唱）
          en: Recitative
          de: Rezitativ
          fr: Récitatif
          it: Recitativo
          es: Recitativo
          zh: 宣叙调
        description:
          ja: ドラマの対話や状況説明を行う歌。バロック・オペラにおける重要な構成要素。
          en: Songs used for dialogue or exposition in drama, a key component of Baroque opera.
      - id: chorus-piece
        label:
