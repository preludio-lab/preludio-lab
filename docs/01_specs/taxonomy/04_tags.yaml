# 5. Tags (タグ)
# =============
# 記事や楽曲の多角的な属性。

tags:
  # --- Mood: 情緒的なラベル ---
  - category: mood
    label:
      ja: ムード・雰囲気
      en: Mood / Atmosphere
      de: Stimmung / Atmosphäre
      fr: Humeur / Atmosphère
      it: Umore / Atmosfera
      es: Ánimo / Atmósfera
      zh: 情绪 / 氛围
    items:
      - id: joyful
        label:
          ja: 歓喜に満ちた
          en: Joyful / Triumphant
          de: Freudig / Triumphierend
          fr: Joyeux / Triomphant
          it: Gioioso / Trionfante
          es: Jubiloso / Triunfante
          zh: 欢快 / 凯旋
        description:
          ja: 勝利、祝祭、突き抜けるような明るさ。
          en: Victory, celebration, and piercing brightness.
      - id: passionate
        label:
          ja: 情熱的な
          en: Passionate
          de: Leidenschaftlich
          fr: Passionné
          it: Appassionato
          es: Apasionado
          zh: 激情
        description:
          ja: 激しい感情のほとばしり、熱量のある音楽。
          en: Intense emotional outbursts and high-energy music.
      - id: brilliant
        label:
          ja: 華麗な・輝かしい
          en: Brilliant
          de: Brillant
          fr: Brillant
          it: Brillante
          es: Brillante
          zh: 华丽 / 辉煌
        description:
          ja: 超絶技巧と結びついた、光り輝くような外向的な美しさ。
          en: Radiant, extroverted beauty often linked with virtuosity.
      - id: dramatic
        label:
          ja: ドラマチックな
          en: Dramatic
          de: Dramatisch
          fr: Dramatique
          it: Drammatico
          es: Dramático
          zh: 戏剧性
        description:
          ja: 映画のワンシーンのような物語性と展開。
          en: Narrative quality and development like a scene from a movie.
      - id: serene
        label:
          ja: 静謐な・穏やかな
          en: Serene / Peaceful
          de: Heiter / Friedlich
          fr: Serein / Paisible
          it: Sereno / Pacifico
          es: Sereno / Pacífico
          zh: 宁静 / 和平
        description:
          ja: 心を落ち着かせる、静かで澄んだ響き。
          en: Calm, clear sounds that settle the mind.
      - id: healing
        label:
          ja: 癒やされる
          en: Healing / Soothing
          de: Heilend / Beruhigend
          fr: Apaisant / Guérissant
          it: Rilassante / Lenitivo
          es: Curativo / Relajante
          zh: 治愈 / 舒缓
        description:
          ja: 疲れた心を優しく包み込むような温かさ。
          en: Warmth that gently envelops a tired heart.
      - id: spiritual
        label:
          ja: 崇高な・祈りの
          en: Spiritual / Sacred
          de: Spirituell / Geistlich
          fr: Spirituel / Sacré
          it: Spirituale / Sacro
          es: Espiritual / Sagrado
          zh: 神圣 / 祈祷
        description:
          ja: 宗教的あるいは精神的に高い次元へ導かれる感覚。
          en: A sense of being led to a higher religious or spiritual level.
      - id: ethereal
        label:
          ja: 幻想的な・天上の
          en: Ethereal / Dreamy
          de: Ätherisch / Traumhaft
          fr: Éthéré / Onirique
          it: Etereo / Sognante
          es: Etéreo / Ensoñador
          zh: 虚幻 / 天籁
        description:
          ja: 浮世離れした、夢見心地で神秘的な美しさ。
          en: Otherworldly, dreamy, and mysterious beauty.
      - id: elegant
        label:
          ja: 優雅な
          en: Elegant / Graceful
          de: Elegant / Gnädig
          fr: Élégant / Gracieux
          it: Elegante / Grazioso
          es: Elegante / Gracioso
          zh: 优雅 / 优美
        description:
          ja: 洗練された、貴族的な「洗練」を感じさせる美。
          en: Refined beauty with an aristocratic sense of sophistication.
      - id: majestic
        label:
          ja: 荘厳な・高貴な
          en: Majestic / Noble
          de: Majestätisch / Edel
          fr: Majestueux / Noble
          it: Maestoso / Nobile
          es: Majestuoso / Noble
          zh: 庄严 / 高贵
        description:
          ja: 威厳があり、堂々とした王道的な響き。
          en: Dignified and grand, classic sound.
      - id: pastoral
        label:
          ja: 田園的な
          en: Pastoral / Rustic
          de: Pastoral / Ländlich
          fr: Pastoral / Rustique
          it: Pastorale / Rustico
          es: Pastoral / Rústico
          zh: 田园
        description:
          ja: 自然の風景、鳥の声、のどかな田舎の情景。
          en: Landscapes, bird songs, and peaceful country scenes.
      - id: nostalgic
        label:
          ja: 懐かしい
          en: Nostalgic
          de: Nostalgisch
          fr: Nostalgique
          it: Nostalgico
          es: Nostálgico
          zh: 怀旧 / 思乡
        description:
          ja: 遠い記憶を呼び覚ますような温かい追憶。
          en: Warm reminiscence that awakens distant memories.
      - id: melancholic
        label:
          ja: 哀愁漂う・切ない
          en: Melancholic / Sentimental
          de: Melancholisch / Sentimental
          fr: Mélancolique / Sentimental
          it: Malinconico / Sentimentale
          es: Melancólico / Sentimental
          zh: 忧郁 / 感伤
        description:
          ja: 個人的な、甘美さを伴う「切なさ」。胸を締め付けるような悲しみや郷愁。
          en: Personal sadness or nostalgia with a sense of sweetness.
      - id: gloomy
        label:
          ja: 暗鬱な・深刻な
          en: Gloomy / Dark
          de: Düster / Dunkel
          fr: Lugubre / Sombre
          it: Tetro / Oscuro
          es: Sombrío / Oscuro
          zh: 阴郁 / 黑暗
        description:
          ja: より重く、深い絶望、出口のない「暗さ」。内省的な闇。
          en: Heavier, deep despair, a darkness with no exit.
      - id: tragic
        label:
          ja: 悲劇的な
          en: Tragic
          de: Tragisch
          fr: Tragique
          it: Tragico
          es: Trágico
          zh: 悲剧性
        description:
          ja: 避けられない運命や、激しく打ちひしがれるような悲劇性。
          en: Inevitable fate and overhelming tragedy.
      - id: tense
        label:
          ja: 緊迫した・スリリングな
          en: Tense / Thrilling
          de: Gespannt / Spannend
          fr: Tendu / Palpitant
          it: Teso / Emozionante
          es: Tenso / Emocionante
          zh: 紧张 / 扣人心弦
        description:
          ja: 手に汗握るようなスピード感や焦燥感。
          en: A sense of speed or impatience that makes hands sweat.

  # --- Situation: 利用シーン ---
  - category: situation
    label:
