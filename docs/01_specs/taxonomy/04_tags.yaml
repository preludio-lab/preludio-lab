          zh: 清新的早晨
      - id: afternoon-tea
        label:
          ja: 午後のティータイム
          en: Afternoon Tea / Break
          de: Nachmittagstee / Pause
          fr: Thé de l'après-midi
          it: Tè pomeridiano
          es: Té de la tarde
          zh: 下午茶时间
      - id: night
        label:
          ja: 静かな夜に
          en: Night / Late Night
          de: Stille Nacht
          fr: Nuit calme
          it: Notte silenziosa
          es: Noche tranquila
          zh: 宁静的夜晚
      - id: deep-focus
        label:
          ja: 集中・作業用
          en: Deep Focus
          de: Tiefe Konzentration
          fr: Concentration profonde
          it: Concentrazione profonda
          es: Concentración profunda
          zh: 深度专注 / 工作用
      - id: relax
        label:
          ja: リラックスタイム
          en: Relax / Chill
          de: Entspannung
          fr: Détente
          it: Relax
          es: Relajación
          zh: 放松时间
      - id: sleep
        label:
          ja: 眠りのために
          en: Sleep / Lullaby
          de: Schlaf / Wiegenlied
          fr: Sommeil / Berceuse
          it: Sonno / Ninna nanna
          es: Sueño / Canción de cuna
          zh: 助眠 / 摇篮曲

  # --- Terminology: 音楽用語 ---
  - category: terminology
    label:
      ja: 音楽用語・キーワード
      en: Terminology
      de: Terminologie
      fr: Terminologie
      it: Terminologia
      es: Terminología
      zh: 音乐术语
    items:
      - id: virtuoso
        label:
          ja: 超絶技巧
          en: Virtuoso
          de: Virtuose / Virtuosität
          fr: Virtuosité
          it: Virtuosismo
          es: Virtuosismo
          zh: 超绝技巧 / 演奏名家
        description:
          ja: 人間離れした技術、圧倒的な指回りを堪能する作品。
          en: Works to enjoy superhuman technique and overwhelming fingerwork.
      - id: period-instrument
        label:
          ja: 古楽器演奏
          en: Period Instrument
          de: Historische Instrumente
          fr: Instruments d'époque
          it: Strumenti originali
          es: Instrumentos de época
          zh: 古乐器演奏
        description:
          ja: 作曲当時の楽器による、素朴で刺激的な響き。
          en: Rustic and stimulating sounds of instruments from the time of composition.
      - id: transcription
        label:
          ja: 編曲・トランスクリプション
          en: Transcription
          de: Transkription
          fr: Transcription
          it: Trascrizione
          es: Transcripción
          zh: 改编曲
      - id: pizzicato
        label:
          ja: ピチカート
          en: Pizzicato
          de: Pizzicato
          fr: Pizzicato
          it: Pizzicato
          es: Pizzicato
          zh: 拨弦奏法
      - id: unfinished-beauty
        label:
          ja: 未完成の美
          en: Unfinished
          de: Unvollendet
          fr: Inachevé
          it: Incompiuto
          es: Inacabado
          zh: 未完成之美
      - id: accessible-classics
        label:
          ja: 親しみやすい名曲
          en: Accessible Classics / BGM
          de: Zugängliche Klassik
          fr: Classique accessible
          it: Classica accessibile
          es: Clásicos accesibles
          zh: 通俗名曲 / BGM

