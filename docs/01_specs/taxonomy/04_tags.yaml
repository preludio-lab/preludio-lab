  # --- Pedagogy: 学習・教育 ---
  - category: pedagogy
    label:
      ja: 学習・教育
      en: Pedagogy / Study
      de: Pädagogik / Studium
      fr: Pédagogie / Étude
      it: Pedagogia / Studio
      es: Pedagogía / Estudio
      zh: 教育 / 学习
    items:
      - id: analysis-focus
        label:
          ja: 楽曲分析（アナリーゼ）向け
          en: For Analysis / Study
          de: Für Analyse / Studium
          fr: Pour l'analyse / étudie
          it: Per l'analisi / studio
          es: Para el análisis / estudio
          zh: 乐曲分析（分析用）
        description:
          ja: 形式や構造が明確で、音楽理論の学習や楽曲分析の素材として適した名作。
          en: Masterpieces with clear form and structure, suitable for music theory study and analysis.
      - id: counterpoint-mastery
