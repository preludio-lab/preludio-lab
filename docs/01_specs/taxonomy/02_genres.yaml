          fr: Variations
          it: Variazioni
          es: Variaciones
          zh: 变奏曲
        description:
          ja: 主題（Theme）をリズム、メロディ、和声面で変形させていく形式。
          en: A form where a theme is transformed through rhythmic, melodic, or harmonic changes.
      - id: fugue-counterpoint
        label:
          ja: フーガ・対位法
          en: Fugue / Counterpoint
          de: Fuge / Kontrapunkt
