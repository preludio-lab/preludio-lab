        description:
          ja: 模倣対位法に基づく形式。カノン、インヴェンション等。
          en: Forms based on imitative counterpoint, such as canons or inventions.
      - id: suite-partita
        label:
          ja: 組曲・パルティータ
          en: Suite / Partita
          de: Suite / Partita
          fr: Suite / Partita
          it: Suite / Partita
          es: Suite / Partita
          zh: 组曲 / 帕蒂塔
        description:
          ja: 複数の舞曲や楽曲を組み合わせた形式。
          en: A sequence of contrasting movements, often based on dance forms.
      - id: rondo
        label:
          ja: ロンド
          en: Rondo
          de: Rondo
          fr: Rondeau / Rondo
          it: Rondò
          es: Rondó
          zh: 回旋曲
        description:
          ja: 共通の主題（ロンド主題）が繰り返される形式。
          en: A musical form where a principal theme alternates with contrasting episodes.
      - id: ternary-form
        label:
          ja: 三部形式
          en: Ternary Form
          de: Dreiteilige Liedform
          fr: Forme ternaire
          it: Forma ternaria
          es: Forma ternaria
          zh: 三部曲式
        description:
          ja: A-B-Aの三部構造。
          en: 'A structure in three parts: A-B-A.'
      - id: binary-form
        label:
          ja: 二部形式
          en: Binary Form
          de: Zweiteilige Liedform
          fr: Forme binaire
          it: Forma binaria
          es: Forma binaria
          zh: 二部曲式
        description:
          ja: A-Bの二部構造。
          en: 'A structure in two parts: A-B.'
      - id: cyclic-form
        label:
          ja: 循環形式
          en: Cyclic Form
          de: Zyklische Form
          fr: Forme cyclique
          it: Forma ciclica
          es: Forma cíclica
          zh: 循环形式
        description:
          ja: 特定の主題や動機を全楽章に登場させる手法。
          en: A technique where a theme or motif recurs in multiple movements of a work.
      - id: aria
