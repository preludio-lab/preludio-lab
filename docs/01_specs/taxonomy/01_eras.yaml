# 1. Eras (時代区分)
# ==========================
# 音楽史における主要な時代区分。

eras:
  - id: medieval
    label:
      ja: 中世
      en: Medieval
      de: Mittelalter
      fr: Moyen Âge
      it: Medioevo
      es: Edad Media
      zh: 中世纪
    start_year: 500
    end_year: 1400
    description:
      ja: 500年頃から1400年頃まで。グレゴリオ聖歌や初期ポリフォニーなど。
      en: From around 500 to 1400. Gregorian chant and early polyphony.
  - id: renaissance
    label:
      ja: ルネサンス
      en: Renaissance
      de: Renaissance
      fr: Renaissance
      it: Rinascimento
      es: Renacimiento
      zh: 文艺复兴
    start_year: 1400
    end_year: 1600
    description:
      ja: 1400年頃から1600年頃まで。ジョスカン・デ・プレ、パレストリーナなど。
      en: From around 1400 to 1600. Josquin des Prez, Palestrina, etc.
  - id: baroque
    label:
      ja: バロック
      en: Baroque
      de: Barock
      fr: Baroque
      it: Barocco
      es: Barroco
      zh: 巴洛克
    start_year: 1600
    end_year: 1750
    description:
      ja: 1600年頃から1750年頃まで。バッハ、ヘンデル、ヴィヴァルディ。通奏低音の時代。
      en: From around 1600 to 1750. Bach, Handel, Vivaldi. The era of basso continuo.
  - id: classical
    label:
      ja: 古典派
      en: Classical
      de: Klassik
      fr: Classique
      it: Classicismo
      es: Clasicismo
      zh: 古典主义
    start_year: 1730
    end_year: 1820
    description:
      ja: 1750年頃から1820年頃まで。ハイドン、モーツァルト、ベートーヴェン。形式美の追求。
      en: From around 1750 to 1820. Haydn, Mozart, Beethoven. Pursuit of formal beauty.
  - id: early-romantic
    label:
      ja: 前期ロマン派
      en: Early Romantic
      de: Frühromantik
      fr: Premier romantisme
      it: Primo Romanticismo
      es: Primer Romanticismo
      zh: 早期浪漫主义
    start_year: 1815
    end_year: 1850
    description:
      ja: シューベルト、メンデルスゾーン、ショパンなど。古典的な形式を維持しつつ、ロマン派的抒情性を導入。
      en: Schubert, Mendelssohn, Chopin, etc. Introducing Romantic lyricism while maintaining classical forms.
  - id: mid-romantic
    label:
      ja: 中期ロマン派
      en: Mid-Romantic
      de: Hochromantik
      fr: Romantisme médiat
      it: Romanticismo pieno
      es: Romanticismo pleno
      zh: 中期浪漫主义
    start_year: 1850
    end_year: 1890
    description:
      ja: リスト、ワーグナー、ブラームスなど。感情表現の極致、和声の拡張、ピアノ技法の発展。
      en: Liszt, Wagner, Brahms, etc. Extreme emotional expression, expansion of harmony, development of piano technique.
  - id: late-romantic
    label:
      ja: 後期ロマン派 / 世紀末
      en: Late Romantic / Fin de siècle
      de: Spätromantik
      fr: Romantisme tardif
      it: Tardo Romanticismo
      es: Romanticismo tardío
      zh: 晚期浪漫主义
    start_year: 1890
    end_year: 1914
    description:
      ja: マーラー、R.シュトラウス。機能和声の限界とオーケストラの大規模化。
      en: Mahler, R. Strauss. Limits of functional harmony and large-scale orchestration.
  - id: impressionism
    label:
      ja: 印象主義
      en: Impressionism
      de: Impressionismus
      fr: Impressionnisme
      it: Impressionismo
      es: Impresionismo
      zh: 印象主义
    start_year: 1890
    end_year: 1930
    description:
      ja: ドビュッシー、ラヴェル。色彩豊かで曖昧な響き、旋法や全音音階の使用。
      en: Debussy, Ravel. Richly colored and ambiguous sounds, use of modes and whole-tone scales.
  - id: modern
    label:
      ja: 近代
      en: Modern
      de: Moderne
      fr: Moderne
      it: Modernismo
      es: Modernismo
      zh: 现代
    start_year: 1900
    end_year: 1945
    description:
      ja: 第二次世界大戦終結まで。ストラヴィンスキー、プロコフィエフ、新ウィーン楽派。
      en: Until the end of World War II. Stravinsky, Prokofiev, Second Viennese School.
  - id: contemporary
    label:
      ja: 現代
      en: Contemporary
      de: Zeitgenössisch
      fr: Contemporain
      it: Contemporaneo
      es: Contemporáneo
      zh: 当代
    start_year: 1945
    end_year: 2100
    description:
      ja: 1945年以降。ケージ、武満徹、スペクトル楽派、および現存する作曲家。
      en: Since 1945. Cage, Takemitsu, Spectral music, and living composers.
